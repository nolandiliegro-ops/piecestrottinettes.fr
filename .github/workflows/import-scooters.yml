name: Import trottinettes (sans PC)

# 14/10/2026 : l'import de modèles ne dépend plus du PC de Nolan.
# Modifier config/imports/_lot-auto.txt = lancer UN run qui importe chaque fichier listé
# (sync-scooters.js --allow-missing-keys --publish : détourage @imgly, photos, publication si complet, retrigger compat).
# Le .env est écrit sur le runner à partir des secrets du dépôt, jamais commité, jamais affiché.

on:
  push:
    branches: [main]
    paths: ['config/imports/_lot-auto.txt', 'config/imports/_photos-auto.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-scooters
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dépendances (détourage)
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Fichier .env du runner
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          ADMIN_BULK_SECRET: ${{ secrets.ADMIN_BULK_SECRET }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$ADMIN_BULK_SECRET" ]; then echo "::error title=import::secret SUPABASE_URL ou ADMIN_BULK_SECRET absent"; exit 1; fi
          KEY=$(grep -oP 'VITE_SUPABASE_PUBLISHABLE_KEY\s*\|\|\s*"\K[^"]+' src/integrations/supabase/client.ts)
          umask 077
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\nADMIN_BULK_SECRET=%s\n' "$SB_URL" "$KEY" "$ADMIN_BULK_SECRET" > .env
      - name: Photos des brouillons existants (avant import, pour que la publication les voie)
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 25/10 : juge vision des photos (verrou fermé sans la clé)
        run: |
          set +e
          export LC_ALL=C.UTF-8
          mkdir -p /tmp/imp
          [ -f config/imports/_photos-auto.txt ] || exit 0
          while read -r f; do
            [ -z "$f" ] && continue
            node scripts/update-photos.js --file "config/imports/$f" > "/tmp/imp/photos-$f.log" 2>&1; code=$?
            echo "::notice title=photos $f::EXIT=$code"
          done < config/imports/_photos-auto.txt
      - name: Import fichier par fichier
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 25/10 : juge vision des photos (verrou fermé sans la clé)
        run: |
          set +e
          export LC_ALL=C.UTF-8
          mkdir -p /tmp/imp
          while read -r f; do
            [ -z "$f" ] && continue
            node scripts/sync-scooters.js --file "config/imports/$f" --allow-missing-keys --publish > "/tmp/imp/$f.log" 2>&1; code=$?
            ins=$(grep -oP 'Insérés : \K\d+' "/tmp/imp/$f.log" | awk '{s+=$1} END{print s+0}')
            pub=$(grep -c ' : publié$' "/tmp/imp/$f.log")
            draft=$(grep -c 'reste brouillon' "/tmp/imp/$f.log")
            imgerr=$(grep -oP 'Images : \d+ ok, \K\d+' "/tmp/imp/$f.log" | awk '{s+=$1} END{print s+0}')
            err=$(grep -c '✗' "/tmp/imp/$f.log")
            echo "::notice title=import $f::EXIT=$code · inseres=$ins · publies=$pub · brouillons=$draft · erreurs_image=$imgerr · lignes_erreur=$err"
            grep '✗' "/tmp/imp/$f.log" | head -15 | sed "s/^/::warning title=$f::/"
            tail -n 15 "/tmp/imp/$f.log" | grep -v -i 'secret\|bearer\|eyJ' | sed "s/^/::warning title=$f fin du log::/"
          done < config/imports/_lot-auto.txt
      - name: Journal lisible (branche donnees-import, secrets filtrés)
        if: always()
        shell: bash
        run: |
          rm -f .env
          mkdir -p /tmp/out && for f in /tmp/imp/*.log; do [ -f "$f" ] && grep -v -i 'secret\|bearer\|eyJ\|apikey\|sk_' "$f" > "/tmp/out/$(basename "$f")"; done
          git config user.name "import-bot"; git config user.email "import-bot@users.noreply.github.com"
          if git fetch -q origin donnees-import 2>/dev/null; then git checkout -qf -B donnees-import origin/donnees-import
          else git checkout -qf --orphan donnees-import && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +; fi
          mkdir -p "runs/${GITHUB_RUN_ID}" && cp /tmp/out/*.log "runs/${GITHUB_RUN_ID}/" 2>/dev/null
          git add runs && git commit -qm "journal import run ${GITHUB_RUN_ID}" && git push -q origin donnees-import
      - name: Nettoyage
        if: always()
        run: rm -f .env
