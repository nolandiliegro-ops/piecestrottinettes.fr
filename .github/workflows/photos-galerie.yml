name: Photos galerie (détourage + garde-fou)

# 16/10/2026 : galeries de 3+ photos détourées par trottinette, sans PC.
# Modifier config/photos/_run.txt = UN run. Une ligne par lot : « dry lot01 » ou « write lot01 ».
#  - dry   : détourage + contrôle de chaque candidate → planches JPEG + report.json sur la branche donnees-photos
#            (out/<lot>/), AUCUNE écriture en base. Claude relit les planches avant tout write.
#  - write : n'envoie que les photos choisies dans config/photos/<lot>.accept.json, après un 2e passage du garde-fou.
# Le .env est écrit sur le runner à partir des secrets, jamais commité, jamais affiché.

on:
  push:
    branches: [main]
    paths: ['config/photos/_run.txt']
  workflow_dispatch:

permissions:
  contents: write

# Pas de file d'attente : chaque push part tout de suite (lots en parallèle, résultats sur des dossiers distincts).

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dépendances (détourage)
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Fichier .env du runner (mode write seulement)
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          ADMIN_BULK_SECRET: ${{ secrets.ADMIN_BULK_SECRET }}
        run: |
          if grep -qE '^(write|append|compat|smoke-doublon|empreintes-backfill) |^(nettoyage|redetourage|cadrage) write' config/photos/_run.txt; then
            if [ -z "$SB_URL" ] || [ -z "$ADMIN_BULK_SECRET" ]; then echo "::error title=photos::secret absent"; exit 1; fi
            KEY=$(grep -oP 'VITE_SUPABASE_PUBLISHABLE_KEY\s*\|\|\s*"\K[^"]+' src/integrations/supabase/client.ts)
            umask 077
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\nADMIN_BULK_SECRET=%s\n' "$SB_URL" "$KEY" "$ADMIN_BULK_SECRET" > .env
          fi
      - name: Lots
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          export LC_ALL=C.UTF-8
          mkdir -p out
          while read -r mode lot extra; do
            [ -z "$lot" ] && continue
            if [ "$mode" = "fetch" ]; then
              # Lecture seule : télécharge des images publiques (liste « nom url ») pour les rendus de maquettes.
              mkdir -p "out/fetch-$lot"; n=0
              while read -r name url; do
                [ -z "$url" ] && continue
                curl -s -L --max-time 30 -o "out/fetch-$lot/$name" "$url" && n=$((n+1))
              done < "config/photos/$lot.txt"
              echo "::notice title=$lot fetch::$n fichiers"
              continue
            fi
            if [ "$mode" = "compat" ]; then
              # Relance du moteur de compatibilité (toutes catégories à clés) sur toutes les pièces publiées.
              node scripts/_retrigger-by-category.mjs > "out/compat-$lot.log" 2>&1
              echo "::notice title=compat::EXIT=$?"
              tail -n 40 "out/compat-$lot.log" | grep -v -i 'secret\|bearer\|eyJ' | sed 's/^/::notice title=compat::/'
              continue
            fi
            if [ "$mode" = "detourage" ]; then
              # Lecture seule : audit du détourage de toutes les photos de trottinettes publiées (voile, débris, liseré).
              node scripts/audit-detourage.mjs > "out/detourage-$lot.log" 2>&1
              echo "::notice title=detourage::EXIT=$?"
              grep '^::' "out/detourage-$lot.log" | head -5
              tail -n 3 "out/detourage-$lot.log"
              continue
            fi
            if [ "$mode" = "coupe" ]; then
              # Lecture seule : trottinettes coupées (bord plat) sur les photos publiées.
              node scripts/audit-coupe.mjs > "out/coupe-$lot.log" 2>&1
              echo "::notice title=coupe::EXIT=$?"
              grep '^::' "out/coupe-$lot.log" | head -5
              tail -n 3 "out/coupe-$lot.log"
              continue
            fi
            if [ "$mode" = "cadrage" ]; then
              # Cadrage uniforme + photo principale de trois-quarts (config/photos/vues.json). « cadrage dry » / « cadrage write ».
              node scripts/scooters-cadrage.mjs --$lot ${extra:+--slugs $extra} > "out/cadrage-$lot.log" 2>&1
              echo "::notice title=cadrage::EXIT=$?"
              grep '^::' "out/cadrage-$lot.log" | grep -v -i 'secret\|bearer\|eyJ' | head -40
              tail -n 5 "out/cadrage-$lot.log" | grep -v -i 'secret\|bearer\|eyJ'
              continue
            fi
            if [ "$mode" = "redetourage" ]; then
              # Re-détourage local (@imgly large) des photos de trottinettes à fantômes. « redetourage dry [N] » / « redetourage write ».
              node scripts/redetourage.mjs --$lot ${extra:+--limit $extra} > "out/redetourage-$lot.log" 2>&1
              echo "::notice title=redetourage::EXIT=$?"
              grep '^::' "out/redetourage-$lot.log" | grep -v -i 'secret\|bearer\|eyJ' | head -40
              tail -n 5 "out/redetourage-$lot.log" | grep -v -i 'secret\|bearer\|eyJ'
              continue
            fi
            if [ "$mode" = "nettoyage" ]; then
              # Nettoyage des fantômes de détourage (trottinettes). « nettoyage dry » = planches avant/après, « nettoyage write » = écrit.
              node scripts/nettoyage-detourage.mjs --$lot ${extra:+--$extra} > "out/nettoyage-$lot$extra.log" 2>&1
              echo "::notice title=nettoyage::EXIT=$?"
              grep '^::' "out/nettoyage-$lot$extra.log" | grep -v -i 'secret\|bearer\|eyJ' | head -40
              tail -n 3 "out/nettoyage-$lot$extra.log" | grep -v -i 'secret\|bearer\|eyJ'
              continue
            fi
            if [ "$mode" = "audit" ]; then
              # Lecture seule : audit des galeries en ligne (doublons, gros plans, 2e photo proposée) + planches.
              node scripts/audit-galeries.mjs --file "config/photos/$lot.json" > "out/$lot.$mode.log" 2>&1
              echo "::notice title=$lot audit::EXIT=$?"
              grep '^::' "out/$lot.$mode.log" | head -5
              continue
            fi
            if [ "$mode" = "empreintes-backfill" ]; then
              # 25/10 : remplit public.photo_empreintes via process-images { backfill_fp } (n'écrit jamais dans les galeries).
              node scripts/_backfill-empreintes.mjs > "out/empreintes-backfill.log" 2>&1
              echo "::notice title=empreintes-backfill::EXIT=$?"
              grep -v -i 'secret\|bearer\|eyJ' "out/empreintes-backfill.log" | tail -n 6
              continue
            fi
            if [ "$mode" = "smoke-doublon" ]; then
              # 25/10 : smoke-test du garde-fou de process-images. « smoke-doublon lire x » = lecture seule ; « smoke-doublon fire x » = + append refusé attendu.
              flag=""; [ "$lot" = "fire" ] && flag="--fire"
              node scripts/_smoke-process-images-doublon.mjs $flag > "out/smoke-doublon.log" 2>&1
              echo "::notice title=smoke-doublon::EXIT=$?"
              grep -v -i 'secret\|bearer\|eyJ' "out/smoke-doublon.log" | tail -n 8
              continue
            fi
            if [ "$mode" = "verrou-test" ]; then
              node scripts/_test-verrou-import.mjs > "out/verrou-test.log" 2>&1
              echo "::notice title=verrou-test::EXIT=$?"
              cat "out/verrou-test.log" | tail -n 8
              continue
            fi
            if [ "$mode" = "juge" ]; then
              # Lecture seule (25/10) : juge VISION des photos de trottinettes. « juge tout x » ou « juge slugs a,b,c ».
              jargs=""; [ "$lot" = "slugs" ] && jargs="--slugs $extra"
              node scripts/juge-photos.mjs $jargs > "out/juge.log" 2>&1
              echo "::notice title=juge::EXIT=$?"
              grep '^::' "out/juge.log" | head -5
              tail -n 3 "out/juge.log"
              continue
            fi
            if [ "$mode" = "doublons-core" ]; then
              # Lecture seule (25/10) : calibration du cœur de process-images (Node 22 pour importer le .ts).
              npx -y node@22 scripts/garde-doublons-core.mjs > "out/doublons-core.log" 2>&1
              echo "::notice title=doublons-core::EXIT=$?"
              grep '^::' "out/doublons-core.log" | head -5
              continue
            fi
            if [ "$mode" = "doublons" ]; then
              # Lecture seule (25/10) : « doublons calibrer x » ou « doublons ronde x » — garde-fou anti-doublon.
              node scripts/garde-doublons.mjs --$lot > "out/doublons-$lot.log" 2>&1
              echo "::notice title=doublons $lot::EXIT=$?"
              grep '^::' "out/doublons-$lot.log" | head -5
              continue
            fi
            if [ "$mode" = "angles" ]; then
              # Lecture seule (24/10) : « angles <lot> <scooter_models|parts> [seuil_iou] [slug1,slug2] » — 3 angles distincts par fiche.
              read -r table iou slugs <<< "$extra"
              aargs="--lot $lot --table ${table:-scooter_models}"
              [ -n "$iou" ] && aargs="$aargs --iou $iou"
              # « toutes:slug1,slug2 » (25/10) = planches de TOUTES les fiches listées, signalées ou non
              case "$slugs" in
                toutes) aargs="$aargs --toutes" ;;
                toutes:*) aargs="$aargs --toutes --slugs ${slugs#toutes:}" ;;
                ?*) aargs="$aargs --slugs $slugs" ;;
              esac
              node scripts/audit-angles.mjs $aargs > "out/angles-$lot.log" 2>&1
              echo "::notice title=$lot angles::EXIT=$?"
              grep '^::' "out/angles-$lot.log" | head -5
              tail -n 3 "out/angles-$lot.log"
              continue
            fi
            if [ "$mode" = "append" ]; then
              node scripts/photos-galerie.mjs --write --append --file "config/photos/$lot.json" --accept "config/photos/$lot.accept.json" > "out/$lot.$mode.log" 2>&1
            elif [ "$mode" = "write" ]; then
              node scripts/photos-galerie.mjs --write --file "config/photos/$lot.json" --accept "config/photos/$lot.accept.json" > "out/$lot.$mode.log" 2>&1
            else
              node scripts/photos-galerie.mjs --dry --file "config/photos/$lot.json" > "out/$lot.$mode.log" 2>&1
            fi
            echo "::notice title=$lot $mode::EXIT=$?"
            grep '^::' "out/$lot.$mode.log" | grep -v -i 'secret\|bearer\|eyJ' | head -60
            tail -n 3 "out/$lot.$mode.log" | grep -v -i 'secret\|bearer\|eyJ' | sed "s/^/::warning title=$lot fin::/"
          done < config/photos/_run.txt
      - name: Nettoyage du secret
        if: always()
        run: rm -f .env
      - name: Résultats → branche donnees-photos
        if: always()
        shell: bash
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          mv out /tmp/out
          git fetch origin donnees-photos || true
          if git show-ref --quiet refs/remotes/origin/donnees-photos; then git checkout -B donnees-photos origin/donnees-photos; else git checkout --orphan donnees-photos && git rm -rf -q . ; fi
          mkdir -p out && cp -r /tmp/out/. out/
          git add out
          git commit -q -m "photos : $(tr '\n' ' ' < /dev/null)$(date -u +%FT%TZ)" || echo "rien à commiter"
          for i in 1 2 3; do git push origin donnees-photos && break; git pull --rebase origin donnees-photos; done
