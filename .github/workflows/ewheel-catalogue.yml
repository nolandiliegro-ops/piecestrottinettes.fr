name: Fournisseur eWheel — lecture du catalogue

# Relit chaque semaine le catalogue public eWheel (Shopify, sans connexion) et dépose
# fournisseurs/ewheel/ sur la branche donnees-extraction. 0 € d'API IA, aucun secret,
# n'écrit rien en base, ne touche jamais main. Un push du script ou de ce fichier relance une lecture.

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/suppliers/ewheel-crawl.mjs'
      - '.github/workflows/ewheel-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extracteur-marques
  cancel-in-progress: false

jobs:
  ewheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Branche de données
        run: |
          git config --global user.name "extracteur-pt"
          git config --global user.email "extracteur-pt@users.noreply.github.com"
          git fetch origin donnees-extraction
          git worktree add ../data -B donnees-extraction origin/donnees-extraction
      - name: Lecture eWheel
        run: node scripts/suppliers/ewheel-crawl.mjs --out ../data/fournisseurs/ewheel
      - name: Publier
        run: |
          cd ../data
          git add -- fournisseurs/ewheel
          if git diff --cached --quiet; then echo "Catalogue inchangé."; exit 0; fi
          git commit -m "ewheel : lecture run ${{ github.run_id }}"
          git push origin donnees-extraction
