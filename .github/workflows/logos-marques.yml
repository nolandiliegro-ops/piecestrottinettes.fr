name: Logos des marques — récolte

# Télécharge icônes et logos depuis les sites officiels (config/logos-marques.json) vers la branche
# donnees-extraction (dossier logos/). 0 € d'API IA, n'écrit rien en base, ne touche jamais main.

on:
  push:
    branches: [main]
    paths: ['config/logos-marques.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extracteur-marques
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Branche de données
        run: |
          git config --global user.name "extracteur-pt"
          git config --global user.email "extracteur-pt@users.noreply.github.com"
          git fetch origin donnees-extraction
          git worktree add ../data -B donnees-extraction origin/donnees-extraction
      - name: Récolte
        run: node scripts/logos/fetch-brand-logos.mjs --out ../data/logos
      - name: Publier
        if: always()
        run: |
          cd ../data
          git add -- logos 2>/dev/null || true
          if git diff --cached --quiet; then echo "Aucun fichier nouveau."; exit 0; fi
          git commit -m "logos : run ${{ github.run_id }}"
          git push origin donnees-extraction
