name: Alertes retour en stock — toutes les 3 h

on:
  schedule:
    # Toutes les 3 heures (20/10/2026 : repo passé en privé, quota Actions limité ;
    # 0 inscription en base à cette date — repasser à l'heure si le volume le justifie)
    - cron: '7 */3 * * *'
  workflow_dispatch:

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Appel process-stock-alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STOCK_ALERTS_CRON_SECRET: ${{ secrets.STOCK_ALERTS_CRON_SECRET }}
        run: |
          curl -fsS -X POST "${SUPABASE_URL}/functions/v1/process-stock-alerts" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: ${STOCK_ALERTS_CRON_SECRET}" \
            -d '{"dry_run":false}'
