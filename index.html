<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pièces Trottinettes | Spécialiste Pièces Détachées</title>
    <meta name="description" content="Pièces détachées pour trottinettes électriques : pneus, chambres à air, plaquettes, chargeurs. Compatibilité garantie avec ton modèle. Atelier à Marseille." data-rh="true">
    <meta property="og:title" content="piecestrottinettes.fr — Plus jamais la mauvaise pièce" data-rh="true">
    <meta property="og:description" content="Pièces détachées pour trottinettes électriques : pneus, chambres à air, plaquettes, chargeurs. Compatibilité garantie avec ton modèle. Atelier à Marseille." data-rh="true">
    <meta name="twitter:card" content="summary_large_image" data-rh="true">
    <!-- Aperçus de liens (WhatsApp, Messenger, Telegram lisent cette page SANS JavaScript) :
         description, og:title, og:description, og:image fixes ci-dessus et ci-dessous.
         data-rh="true" : Helmet (src/components/SEO.tsx) les REMPLACE par ceux de la page,
         jamais de doublon. Sans eux, WhatsApp affichait ce commentaire comme description (25/10). -->
    <meta name="author" content="Pièces Trottinettes" />

    <!-- Google Fonts: Bebas Neue + Anton (display) + Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">


    <!-- Open Graph — filet pour scrapers sociaux sans JS UNIQUEMENT.
         Tout ce que le composant SEO injecte par page a été retiré d'ici :
         helmet AJOUTE ses balises au head sans remplacer les statiques (seul le
         titre est remplacé nativement), et la générique passait en premier.
         N'ajoute ici que ce que le composant SEO ne rend jamais. -->
    <meta property="og:site_name" content="Pièces Trottinettes" />
    <!-- data-rh : Helmet REMPLACE cette balise par celle de la page (sinon 2 og:image, la statique en premier — audit SEO 24/10). -->
    <meta property="og:image" content="https://piecestrottinettes.fr/brand/og-image.jpg" data-rh="true">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PiècesTrott" />
    <meta name="theme-color" content="#F5F0E8" />

    <!-- Schema.org Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pièces Trottinettes",
      "url": "https://piecestrottinettes.fr",
      "logo": "https://piecestrottinettes.fr/brand/logo-pt-2026.png",
      "description": "Spécialiste des pièces détachées pour trottinettes électriques. Xiaomi, Ninebot, Kaabo, Dualtron. Expert Marseille — piecestrottinettes.fr.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Marseille",
        "addressCountry": "FR"
      },
      "sameAs": [
        "https://www.tiktok.com/@steedytrott"
      ]
    }
    </script>

    <!-- Schema.org WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pièces Trottinettes",
      "url": "https://piecestrottinettes.fr",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://piecestrottinettes.fr/catalogue?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- build 2026-08-29 -->
  </head>

  <body>
    <div id="root"></div>
