<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre statique : react-helmet-async REMPLACE nativement le <title>, aucun doublon.
         La meta description, elle, est ajoutée en plus de la statique → elle vit
         uniquement dans <SEO> (src/components/SEO.tsx), jamais ici. -->
    <title>Pièces Trottinettes | Spécialiste Pièces Détachées</title>
    <meta name="author" content="Pièces Trottinettes" />

    <!-- Google Fonts: Bebas Neue + Anton (display) + Plus Jakarta Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">


    <!-- Open Graph — filet pour scrapers sociaux sans JS UNIQUEMENT.
         Tout ce que le composant SEO injecte par page a été retiré d'ici :
         helmet AJOUTE ses balises au head sans remplacer les statiques (seul le
         titre est remplacé nativement), et la générique passait en premier.
         N'ajoute ici que ce que le composant SEO ne rend jamais. -->
    <meta property="og:site_name" content="Pièces Trottinettes" />
    <meta property="og:image" content="https://kqsxscjtlipregkrmucg.supabase.co/storage/v1/object/public/site-assets/og-image.png">

    <meta name="twitter:site" content="@piecestrottinettes" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.png" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PiècesTrott" />
    <meta name="theme-color" content="#F5F0E8" />

    <!-- Schema.org Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pièces Trottinettes",
      "url": "https://piecestrottinettes.fr",
      "logo": "https://piecestrottinettes.fr/favicon.png",
      "description": "Spécialiste des pièces détachées pour trottinettes électriques. Xiaomi, Ninebot, Kaabo, Dualtron. Expert Marseille — Steedy Trott.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Marseille",
        "addressCountry": "FR"
      },
      "sameAs": [
        "https://www.tiktok.com/@steadytrott"
      ]
    }
    </script>

    <!-- Schema.org WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pièces Trottinettes",
      "url": "https://piecestrottinettes.fr",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://piecestrottinettes.fr/catalogue?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- build 2026-08-29 -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
